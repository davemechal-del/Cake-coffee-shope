<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Buna &amp; Cake</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="nav"><a class="brand" href="index.html"><span class="logo">B</span> Buna &amp; Cake</a><nav><a href="index.html">Back to site</a><button id="logoutBtn" class="btn small">Logout</button></nav></header>
<main class="admin-wrap">
  <h1>Menu admin</h1>
  <p class="muted">Add, edit or delete products. Changes appear on the public menu immediately.</p>
  <div id="loginBox" class="panel">
    <h2>Admin login</h2>
    <form id="loginForm">
      <label>Email<input id="email" type="email" required placeholder="admin@example.com"></label>
      <label>Password<input id="password" type="password" required></label>
      <button class="btn">Login</button>
    </form>
  </div>
  <div id="adminPanel" style="display:none">
    <form id="productForm" class="panel form-grid">
      <h2 id="formTitle">Add product</h2>
      <label>Product name*<input id="name" required placeholder="e.g. Caffe Latte"></label>
      <label>Price (Br)*<input id="price" type="number" min="0" step="0.01" required placeholder="85"></label>
      <label>Category<input id="category" placeholder="Coffee or Cake"></label>
      <label>Image URL<input id="image" placeholder="https://..."></label>
      <label class="wide">Description<textarea id="description" placeholder="Short description"></textarea></label>
      <div class="row"><button id="submitBtn" class="btn">Add Product</button><button type="button" id="cancelBtn" class="btn ghost">Cancel edit</button></div>
    </form>
    <h2>Current products</h2><div id="adminList"></div>
  </div>
  <p id="msg" class="msg"></p>
</main>
<script type="module" src="js/admin.js"></script>
</body>
</html>
